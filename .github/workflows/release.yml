name: Release

# Push a tag like v0.1.0 to publish a GitHub release with that version's
# CHANGELOG.md section as notes. There are no binaries: apps pin the tag's
# commit in their Cargo.toml.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tag matches the version and has release notes
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          scripts/release-notes.sh "$version" > notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "piddle-common ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
